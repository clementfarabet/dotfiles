# ~/.config/starship.toml — Catppuccin Mocha
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "catppuccin_mocha"

format = """
$os$directory$git_branch$git_status$python$nodejs$rust$golang$docker_context$cmd_duration
$character"""

[os]
disabled = false
style = "fg:lavender"
format = "[$symbol ]($style)"

[os.symbols]
Macos = ""

[directory]
style = "bold fg:sapphire"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "fg:mauve"
format = "[on](fg:overlay1) [$symbol$branch]($style) "

[git_status]
style = "fg:peach"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = " "
style = "fg:yellow"
format = "[via](fg:overlay1) [$symbol$version( \\($virtualenv\\))]($style) "

[nodejs]
symbol = " "
style = "fg:green"
format = "[via](fg:overlay1) [$symbol$version]($style) "

[rust]
symbol = " "
style = "fg:maroon"
format = "[via](fg:overlay1) [$symbol$version]($style) "

[golang]
symbol = " "
style = "fg:sky"
format = "[via](fg:overlay1) [$symbol$version]($style) "

[docker_context]
symbol = " "
style = "fg:blue"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[took $duration]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
overlay1 = "#7f849c"
surface0 = "#313244"
base = "#1e1e2e"
