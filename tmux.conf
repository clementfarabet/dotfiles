# ~/.config/tmux/tmux.conf — symlinked from the dotfiles repo

# ── Prefix: C-o ─────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-o
bind C-o send-prefix          # press C-o twice to send a literal C-o

# ── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true color in iTerm2
set -g mouse on
set -g history-limit 50000
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1     # panes start at 1
set -g renumber-windows on
set -sg escape-time 10        # no lag after Esc (vim)
set -g focus-events on
set -g set-clipboard on
set -g display-time 2000

# All other key bindings are tmux defaults.

# ── Look (Catppuccin Mocha) ─────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[bg=#1e1e2e] "
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#1e1e2e bg=#f38ba8 bold] PREFIX #[default] ,}#[fg=#7f849c]#h  #[fg=#89b4fa]%H:%M "

setw -g window-status-format "#[fg=#7f849c] #I #W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
